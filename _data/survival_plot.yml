config:
  default_dice_count: 11
  default_die_type: 10

tables:
  central_conflicts:
    title: "Центральные конфликты (Выживание)"
    faces:
      1:
        name: "ХОЛОД"
        counts:
          2: "Провалился под лёд или промок на морозе"
          3: "Аномальные морозы, группа застряла в горах"
          4: "Крио-шторм, многодневная метель"
          5: "Ледниковый период"
      2:
        name: "ЖАРА"
        counts:
          2: "Тепловой удар с потерей сознания"
          3: "Аномальная жара без доступа к воде"
          4: "Лесной пожар, группа потерялась в пустыне"
          5: "Долгая повсеместная засуха"
      3:
        name: "ВОДА"
        counts:
          2: "Человек тонет или его сносит течением"
          3: "Кораблекрушение в открытом море"
          4: "Наводнение"
          5: "Мировой потоп"
      4:
        name: "ПОТЕРЯ НАВИГАЦИИ"
        counts:
          2: "Человек заблудился"
          3: "Группа сбилась с маршрута в безлюдной местности"
          4: "Потеря связи в крупном городе, регион без связи и карт"
          5: "Отказ всей навигации в мире, не известно где есть безопасное место"
      5:
        name: "ЗАТОЧЕНИЕ"
        counts:
          2: "Героя придавило или зажало"
          3: "Люди заперты во время аварии или под землей"
          4: "Город в оцеплении"
          5: "Вторжение извне"
      6:
        name: "ЖИВОТНЫЕ"
        counts:
          2: "Нападение хищника"
          3: "Нашествие насекомых или стаи зверей"
          4: "Хищники массового нападают на людей"
          5: "Появление альфа-хищника, массовое истребление фауной людей"
      7:
        name: "БОЛЕЗНЬ"
        counts:
          2: "Инфекция, пищевое отравление, болезнь прогрессирует"
          3: "Эпидемия в изолированной группе"
          4: "Эпидемия в городе"
          5: "Пандемия"
      8:
        name: "ЯД И РАДИАЦИЯ"
        counts:
          2: "Отравление газом или химикатами"
          3: "Группа в зоне заражения"
          4: "Техногенная катастрофа"
          5: "Радиационная катастрофа"
      9:
        name: "СТИХИЯ"
        counts:
          2: "Камнепад, удар молнии, непроходимая местность"
          3: "Буря, лавина, метель, сели"
          4: "Землетрясение, торнадо, извержение"
          5: "Падение огромного метеорита"
      10:
        name: "НЕПРИГОДНАЯ ДЛЯ ЖИЗНИ СРЕДА"
        counts:
          2: "Нехватка воздуха, гипоксия, голод."
          3: "Сбой способа жизнеобеспечения(еда, вода, воздух, токсичность)"
          4: "Разрушение станции или колонии"
          5: "Гибель планеты, апокалипсис"

  complications:
    title: "Подробности и осложнения"
    faces:
      1: "Тяжёлая травма у героя"
      2: "Уничтожено ключевое снаряжение"
      3: "Ресурсов меньше, чем нужно, чтобы выжили все"
      4: "Беспомощный спутник"
      5: "Паника в группе"
      6: "Ложная надежда на спасение"
      7: "Неверное знание о среде"
      8: "Обратный отсчёт"
      9: "Болезнь или зависимость у героя"
      10: "Каким-либо образом затронута личная тайна персонажа игрока"